<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Hotline Miami Redux-Redux Co-op">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12041f"/>
      <stop offset="0.45" stop-color="#4a0a42"/>
      <stop offset="1" stop-color="#ff2f8f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ff3d7f"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0628" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0214" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.16"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="300"/></clipPath>
  </defs>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <g clip-path="url(#frame)">
    <circle cx="600" cy="348" r="128" fill="url(#sun)" opacity="0.92"/>
    <g fill="#3d0840" opacity="0.95">
      <rect x="452" y="248" width="296" height="5"/>
      <rect x="452" y="262" width="296" height="7"/>
      <rect x="452" y="278" width="296" height="9"/>
    </g>
  </g>
  <rect width="1200" height="300" fill="url(#road)"/>
  <g stroke="#33f0ff" stroke-width="1.2" opacity="0.35">
    <line x1="0" y1="292" x2="1200" y2="292"/>
    <line x1="0" y1="282" x2="1200" y2="282"/>
  </g>
  <g stroke="#ff2f8f" stroke-width="1.5" opacity="0.55">
    <line x1="0" y1="288" x2="1200" y2="288"/>
  </g>
  <!-- Brand first: Hotline Miami is the hero signal -->
  <g font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="606" y="118" font-size="76" fill="#1a0020" opacity="0.75">HOTLINE MIAMI</text>
    <text x="600" y="112" font-size="76" fill="#33f0ff" filter="url(#glow)" letter-spacing="3">HOTLINE MIAMI</text>
    <text x="600" y="158" font-size="36" fill="#ff4fa3" stroke="#1a0020" stroke-width="1.2" filter="url(#glow)" letter-spacing="7">REDUX-REDUX · CO-OP</text>
    <text x="600" y="192" font-size="18" fill="#ffffff" opacity="0.92" letter-spacing="5" font-family="'Segoe UI', Arial, sans-serif">ONLINE CO-OP · UP TO 4 PLAYERS</text>
  </g>
  <!-- Version chip — secondary to brand -->
  <g transform="translate(600 228)">
    <rect x="-58" y="-14" width="116" height="28" rx="2" fill="#0a0214" stroke="#33f0ff" stroke-width="1.5" opacity="0.9"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#33f0ff" letter-spacing="3">v2.2.2</text>
  </g>
  <rect width="1200" height="300" fill="url(#scan)"/>
</svg>
